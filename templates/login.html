<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mentor Checker Office Login</title><style>body{font:16px system-ui;background:#f3f6fa;color:#192641}.card{max-width:420px;margin:12vh auto;background:white;padding:32px;border-radius:16px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #b6c6d8;border-radius:8px}button{width:100%;background:#1763c6;color:white;border:0;border-radius:8px;padding:13px;margin-top:15px}.error{color:#a32f2f}</style></head><body><main class="card"><h1>Connected Couriers</h1><h2>Mentor Checker — Office Login</h2><p>Enter the office password to view and manage the checker and Master List.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label>Office password</label><input type="password" name="password" required autocomplete="current-password"><button type="submit">Sign in</button></form></main></body></html>
